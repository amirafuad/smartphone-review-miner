    --btn: #E7EEF7;
    --on-btn: #0C1420;
    --focus: #7FA8FF;

const ASPECTS = [
  { id: "battery", label: "Battery", words: ["baterai","battery","batre","awet","boros","charge","charges","charging","cas","ngecas","daya","drain","drains","mah"] },
  { id: "camera", label: "Camera", words: ["kamera","camera","foto","photo","photos","video","selfie","lensa"] },
  { id: "screen", label: "Screen", words: ["layar","screen","display","amoled","touchscreen","touch","brightness","terang","pixel","pixels","sentuh"] },
  { id: "performance", label: "Performance", words: ["performa","performance","lag","laggy","lagging","ngelag","lemot","hang","prosesor","processor","ram","panas","overheat","overheats","overheating","smooth","kencang","aplikasi","apps","app","restart","crash","crashing","memori","software"] },
  { id: "price", label: "Price", words: ["harga","murah","mahal","price","value","worth","overpriced","budget"] },
  { id: "design", label: "Design and build", words: ["desain","design","bodi","body","warna","color","colors","tipis","ringan","berat","build","premium","murahan","scratches","tergores","cakep","elegan"] },
  { id: "audio", label: "Audio", words: ["speaker","speakers","suara","sound","audio"] },
  { id: "service", label: "Delivery and service", words: ["pengiriman","kirim","delivery","shipping","packing","seller","penjual","garansi","warranty","service","box","kemasan","balas"] }
];
const ASPECT_LOOKUP = new Map();
ASPECTS.forEach(a => a.words.forEach(w => { if (!ASPECT_LOOKUP.has(w)) ASPECT_LOOKUP.set(w, []); ASPECT_LOOKUP.get(w).push(a); }));

function stem(w) {
  return (w.length > 4 && w.endsWith("nya") && w.length - 3 >= 3) ? w.slice(0, -3) : w;
}

function tokenize(text) {
  const re = /[\p{L}\p{N}'’]+/gu;
  const out = [];
  let m, prevEnd = 0, clause = 0, negLeft = 0;
  while ((m = re.exec(text)) !== null) {
    const gap = text.slice(prevEnd, m.index);
    if (/[,.;:!?\n]/.test(gap)) { clause++; negLeft = 0; }
    prevEnd = m.index + m[0].length;
    const w = m[0].toLowerCase().replace(/['’]/g, "");
    if (!w) continue;
    const tok = { raw: m[0], start: m.index, end: prevEnd, clause: clause, kind: "word", stem: stem(w), feat: null, negated: false, w: null };
    if (SPLITTERS.has(w)) {
      tok.kind = "split";
      out.push(tok);
      clause++; negLeft = 0;
      continue;
    }
    if (NEGATIONS.has(w)) { tok.kind = "neg"; negLeft = 2; out.push(tok); continue; }
    if (STOP.has(w) || /^\d+$/.test(w) || w.length < 2) { tok.kind = "stop"; out.push(tok); continue; }
    if (negLeft > 0) { tok.feat = "NOT_" + tok.stem; tok.negated = true; negLeft--; }
    else { tok.feat = tok.stem; }
    out.push(tok);
  }
  return out;
}

function featuresOf(text) {
  return tokenize(text).filter(t => t.feat).map(t => t.feat);
}

function trainModel(data) {
  const counts = { pos: new Map(), neg: new Map() };
  const docs = { pos: 0, neg: 0 };
  for (const [text, label] of data) {
    docs[label]++;
    for (const f of new Set(featuresOf(text))) counts[label].set(f, (counts[label].get(f) || 0) + 1);
  }
  const vocab = new Set([...counts.pos.keys(), ...counts.neg.keys()]);
  const total = { pos: 0, neg: 0 };
  counts.pos.forEach(v => { total.pos += v; });
  counts.neg.forEach(v => { total.neg += v; });
  const V = vocab.size;
  const lp = { pos: new Map(), neg: new Map() };
  vocab.forEach(w => {
    lp.pos.set(w, Math.log(((counts.pos.get(w) || 0) + 1) / (total.pos + V)));
    lp.neg.set(w, Math.log(((counts.neg.get(w) || 0) + 1) / (total.neg + V)));
  });
  const n = docs.pos + docs.neg;
  return { counts, docs, vocab, V, total, lp, prior: { pos: Math.log(docs.pos / n), neg: Math.log(docs.neg / n) } };
}

function classify(feats, model) {
  const seen = new Set(feats.filter(f => model.vocab.has(f)));
  if (seen.size === 0) return { label: "none", p: 0.5 };
  let sp = model.prior.pos, sn = model.prior.neg;
  seen.forEach(f => { sp += model.lp.pos.get(f); sn += model.lp.neg.get(f); });
  const p = 1 / (1 + Math.exp(sn - sp));
  return { label: p >= 0.65 ? "pos" : p <= 0.35 ? "neg" : "mid", p: p };
}

function analyzeReview(text, model) {
  const tokens = tokenize(text);
  tokens.forEach(t => {
    if (t.feat && model.vocab.has(t.feat)) t.w = model.lp.pos.get(t.feat) - model.lp.neg.get(t.feat);
  });
  const overall = classify(tokens.filter(t => t.feat).map(t => t.feat), model);
  const byClause = new Map();
  tokens.forEach(t => {
    if (!byClause.has(t.clause)) byClause.set(t.clause, []);
    byClause.get(t.clause).push(t);
  });
  let posClauses = 0, negClauses = 0;
  const aspectMap = new Map();
  byClause.forEach(list => {
    const cl = classify(list.filter(t => t.feat).map(t => t.feat), model);
    if (cl.label === "pos") posClauses++;
    if (cl.label === "neg") negClauses++;
    const found = new Set();
    list.forEach(t => { (ASPECT_LOOKUP.get(t.stem) || []).forEach(a => found.add(a)); });
    found.forEach(a => {
      const e = aspectMap.get(a.id) || { id: a.id, label: a.label, pos: 0, neg: 0, mentions: 0 };
      e.mentions++;
      if (cl.label === "pos") e.pos++;
      if (cl.label === "neg") e.neg++;
      aspectMap.set(a.id, e);
    });
  });
  let verdict;
  if (posClauses > 0 && negClauses > 0) verdict = "mixed";
  else if (overall.label === "pos") verdict = "positive";
  else if (overall.label === "neg") verdict = "negative";
  else if (posClauses > 0) verdict = "positive";
  else if (negClauses > 0) verdict = "negative";
  else verdict = "unclear";
  return { text: text, tokens: tokens, verdict: verdict, conf: overall.p >= 0.5 ? overall.p : 1 - overall.p, tags: Array.from(aspectMap.values()) };
}

function summarize(list) {
  const counts = { positive: 0, mixed: 0, negative: 0, unclear: 0 };
  const asp = new Map();
  list.forEach(a => {
    counts[a.verdict]++;
    a.tags.forEach(t => {
      const e = asp.get(t.id) || { id: t.id, label: t.label, pos: 0, neg: 0, mentions: 0 };
      e.pos += t.pos; e.neg += t.neg; e.mentions += t.mentions;
      asp.set(t.id, e);
    });
  });
  const features = Array.from(asp.values()).sort((a, b) => b.mentions - a.mentions || a.label.localeCompare(b.label));
  return { total: list.length, counts: counts, features: features };
}

function topWords(model, n) {
  const rows = [];
  model.vocab.forEach(w => {
    const c = (model.counts.pos.get(w) || 0) + (model.counts.neg.get(w) || 0);
    if (c < 2) return;
    rows.push({ w: w, s: model.lp.pos.get(w) - model.lp.neg.get(w) });
  });
  rows.sort((a, b) => b.s - a.s);
  return { pos: rows.slice(0, n), neg: rows.slice(-n).reverse() };
}
/* MODEL_END */

const SAMPLE = [
  "Baterai awet banget, dipakai seharian masih sisa. Kamera juga bagus untuk harga segini.",
  "Hasil foto buram dan layar sering error, kecewa banget.",
  "The screen is gorgeous and the speakers sound great, but the battery drains way too fast.",
  "Pengiriman cepat dan packing rapi, seller ramah. Recommended!",
  "Performa lemot, sering lag dan hang kalau buka banyak aplikasi.",
  "Fast delivery, phone works perfectly and I love the design.",
  "Harganya mahal tapi kualitasnya tidak sebanding. Tidak worth it.",
  "Not good for gaming, it overheats and the camera is only okay.",
  "Desain tipis dan ringan, warnanya cakep, tapi bodinya gampang tergores.",
  "Charging cepat dan tidak panas, mantap.",
  "Kamera depan jelek banget, tidak sesuai deskripsi.",
  "Great value for the money, no lag at all and the display is bright."
];

const LABELS = { positive: "Positive", negative: "Negative", mixed: "Mixed", unclear: "Unclear" };
const MODEL = trainModel(TRAINING);
const TOP = topWords(MODEL, 10);
const html = htm.bind(React.createElement);
const { useState, useMemo } = React;

function Overview({ summary }) {
  const order = ["positive", "mixed", "negative", "unclear"];
  const total = summary.total;
  const label = order.filter(k => summary.counts[k]).map(k => summary.counts[k] + " " + LABELS[k].toLowerCase()).join(", ");
  return html`<div>
    <h2>Overview</h2>
    <div className="stack" role="img" aria-label=${"Review sentiment: " + label}>
      ${order.filter(k => summary.counts[k]).map(k => html`<span key=${k} className=${"seg " + k} style=${{ flexGrow: summary.counts[k] }}></span>`)}
    </div>
    <ul className="legend">
      ${order.filter(k => summary.counts[k]).map(k => html`<li key=${k}>
        <span className=${"dot " + k}></span>${LABELS[k]} <strong>${summary.counts[k]}</strong>
        <span className="pct">${Math.round(summary.counts[k] / total * 100)}%</span>
      </li>`)}
    </ul>
  </div>`;
}

function Features({ features }) {
  return html`<div>
    <h2>Phone features mentioned</h2>
    ${features.length === 0
      ? html`<p className="empty">No features found yet. Mention things like the battery, camera, screen, price or delivery.</p>`
      : html`<ul className="features">
        ${features.map(f => {
          const decided = f.pos + f.neg;
          const text = decided === 0
            ? f.mentions + (f.mentions === 1 ? " mention" : " mentions") + ", no clear sentiment"
            : f.pos + " positive, " + f.neg + " negative (" + f.mentions + (f.mentions === 1 ? " mention)" : " mentions)");
          return html`<li key=${f.id}>
            <span className="fname">${f.label}</span>
            <span className="fbar" role="img" aria-label=${f.label + ": " + text}>
              ${f.pos ? html`<span className="fpos" style=${{ flexGrow: f.pos }}></span>` : null}
              ${f.neg ? html`<span className="fneg" style=${{ flexGrow: f.neg }}></span>` : null}
            </span>
            <span className="fnum">${text}</span>
          </li>`;
        })}
      </ul>`}
  </div>`;
}

function Highlighted({ a }) {
  const out = [];
  let pos = 0;
  a.tokens.forEach((t, i) => {
    if (t.start > pos) out.push(a.text.slice(pos, t.start));
    if (t.w !== null && Math.abs(t.w) >= 0.5) {
      const k = Math.min(1, Math.abs(t.w) / 2.2) * 0.5 + 0.12;
      const name = t.feat.replace("NOT_", "not ");
      out.push(html`<mark key=${i} className=${"w " + (t.w > 0 ? "pos" : "neg") + (t.negated ? " negated" : "")} style=${{ "--k": k }} title=${name + ": leans " + (t.w > 0 ? "positive" : "negative") + " (" + (t.w > 0 ? "+" : "") + t.w.toFixed(1) + ")"}>${t.raw}</mark>`);
    } else if (t.kind === "neg") {
      out.push(html`<span key=${i} className="negword" title="Negation: flips the next two words">${t.raw}</span>`);
    } else {
      out.push(t.raw);
    }
    pos = t.end;
  });
  if (pos < a.text.length) out.push(a.text.slice(pos));
  return html`<${React.Fragment}>${out}<//>`;
}

function ReviewRow({ a }) {
  const showConf = a.verdict === "positive" || a.verdict === "negative";
  return html`<li className=${a.verdict}>
    <div className="vhead">
      <span className=${"badge " + a.verdict}>${LABELS[a.verdict]}</span>
      ${showConf ? html`<span className="conf">${Math.round(a.conf * 100)}% probability</span>` : null}
    </div>
    <p className="rtext"><${Highlighted} a=${a} /></p>
    ${a.tags.length ? html`<ul className="tags">
      ${a.tags.map(t => {
        const sign = t.pos && t.neg ? "±" : t.pos ? "+" : t.neg ? "−" : "";
        const cls = t.pos && t.neg ? "" : t.pos ? "p" : t.neg ? "n" : "";
        const word = t.pos && t.neg ? "mixed" : t.pos ? "positive" : t.neg ? "negative" : "no clear sentiment";
        return html`<li key=${t.id} title=${t.label + ": " + word}>${t.label}${sign ? html`<b className=${cls}>${sign}</b>` : null}</li>`;
      })}
    </ul>` : null}
  </li>`;
}

function HowItWorks() {
  const show = w => w.replace(/^NOT_/, "not ");
  return html`<details className="how">
    <summary>How the classifier works</summary>
    <div className="how-body">
      <ol>
        <li>Each review is lowercased and split into words. Filler words are dropped, and a negation such as “tidak” or “not” flips the next two words, so “not good” is learned separately from “good”.</li>
        <li>A Naïve Bayes classifier compares how likely those words are in positive and in negative training reviews, with add-one smoothing so unseen combinations never score zero.</li>
        <li>Each review is also cut into clauses at commas, “tapi”, “but” and “and”. A clause that mentions a feature is classified on its own, which is how one review can praise the camera and criticise the battery.</li>
      </ol>
      <p className="formula">P(class | words) ∝ P(class) × ∏ P(word | class)</p>
      <p>Trained in your browser on ${MODEL.docs.pos + MODEL.docs.neg} short labelled reviews (${MODEL.V} distinct word forms), written in Indonesian and English. It is a small demo model, so expect mistakes on slang and sarcasm.</p>
      <div className="words">
        <div><strong>Most positive</strong>${TOP.pos.map(r => html`<span key=${r.w} className="chip p">${show(r.w)}</span>`)}</div>
        <div><strong>Most negative</strong>${TOP.neg.map(r => html`<span key=${r.w} className="chip n">${show(r.w)}</span>`)}</div>
      </div>
    </div>
  </details>`;
}

function App() {
  const [text, setText] = useState(SAMPLE.join("\n"));
  const reviews = useMemo(() => text.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 200), [text]);
  const analyses = useMemo(() => reviews.map(r => analyzeReview(r, MODEL)), [reviews]);
  const summary = useMemo(() => summarize(analyses), [analyses]);

  return html`<main className="wrap">
    <header className="top">
      <h1>Smartphone Review Miner</h1>
      <p className="lede">Paste customer reviews, one per line, in Indonesian or English. A Naïve Bayes classifier labels each review and each phone feature it talks about.</p>
    </header>
    <div className="grid">
      <section className="input" aria-labelledby="in-h">
        <h2 id="in-h">Reviews</h2>
        <label className="sr" htmlFor="ta">Reviews, one per line</label>
        <textarea id="ta" value=${text} onInput=${e => setText(e.target.value)} spellCheck=${false} placeholder="Type or paste a review, then press Enter for the next one."></textarea>
        <div className="actions">
          <button type="button" onClick=${() => setText(SAMPLE.join("\n"))}>Load sample reviews</button>
          <button type="button" className="ghost" onClick=${() => setText("")}>Clear</button>
          <span className="count">${reviews.length} ${reviews.length === 1 ? "review" : "reviews"}</span>
        </div>
        <p className="hint">Results update as you type. Up to 200 reviews are analysed, and nothing leaves this page.</p>
      </section>
      <section className="out" aria-live="polite">
        ${reviews.length === 0
          ? html`<p className="empty">Add a review on the left to see its sentiment. Try “Layar bagus tapi baterai boros” or “The camera is great but it overheats”.</p>`
          : html`<${React.Fragment}>
            <${Overview} summary=${summary} />
            <${Features} features=${summary.features} />
            <div>
              <h2>Each review</h2>
              <p className="key">Highlighted words pushed the score: green toward positive, pink toward negative, stronger colour for stronger evidence. A dotted underline marks a negated word. Hover a word for its weight.</p>
              <ul className="reviews">${analyses.map((a, i) => html`<${ReviewRow} key=${i + a.text} a=${a} />`)}</ul>
            </div>
            <//>`}
      </section>
    </div>
    <${HowItWorks} />
    <footer>Built with React and a Naïve Bayes classifier written from scratch, inspired by the thesis “User Review and Mining Application for Smartphone Products”.</footer>
  </main>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
